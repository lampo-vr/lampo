name: Feature request
description: An idea that would make reviewing, or acting on reviews, better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today? A real situation helps more than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work, from the reviewer's or the agent's side.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways it could be solved.
  - type: checkboxes
    id: contract
    attributes:
      label: Data contract
      options:
        - label: This would change what agents read (review.json, events.jsonl, INBOX.md or `lampo` output).
