name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Security problems don't belong here: please report them privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest way to make it happen. If a render matters, its codec, resolution and fps (`ffprobe` output) help a lot.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - local
        - local with LAN / client link
        - server mode
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0, or a commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node -v`), ffmpeg version (`ffmpeg -version | head -1`), browser. In server mode also the storage adapter and reverse proxy.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output or browser console. Remove anything private (paths, tokens, client names).
      render: text
