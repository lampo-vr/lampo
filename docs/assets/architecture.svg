<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 536" width="944" height="536" role="img" aria-labelledby="arch-t arch-d">
<title id="arch-t">How Lampo fits together</title><desc id="arch-d">The browser, MCP clients over HTTP, and lampo or the stdio MCP server talking to a hosted server all come in through the server’s guard to its routes, which send live updates to every open screen. Routes and watchers write through lib/store, as vr and the stdio MCP server on your machine do directly. lib/store keeps data/ and registers every render in versions/ (on disk, Bunny or S3); background jobs read the renders and fill cache/.</desc>
<style>
.d-box{fill:var(--panel,#131314);stroke:var(--line-2,#2a2a2b);stroke-width:1}
.d-lit{fill:var(--panel,#131314);stroke:var(--brand,#f25a1d);stroke-width:1.5}
.d-group{fill:color-mix(in srgb,var(--fg,#eeebe4) 2.5%,transparent);stroke:var(--line-3,#3a3936);stroke-width:1;stroke-dasharray:5 5}
.d-t{fill:var(--fg,#eeebe4);font-family:var(--ui,"Instrument Sans",system-ui,sans-serif);font-size:15px;font-weight:650}
.d-tm{fill:var(--fg,#eeebe4);font-family:var(--mono,"Martian Mono",ui-monospace,monospace);font-size:13.5px;font-weight:500}
.d-s{fill:var(--muted,#8c8982);font-family:var(--ui,"Instrument Sans",system-ui,sans-serif);font-size:12.5px}
.d-c{fill:var(--muted,#8c8982);font-family:var(--mono,"Martian Mono",ui-monospace,monospace);font-size:11px;letter-spacing:.03em}
.d-a{fill:none;stroke:var(--fg-2,#b9b5ad);stroke-width:1.25;stroke-linejoin:round}
.d-h{fill:var(--fg-2,#b9b5ad)}
@media (prefers-color-scheme: light){
.d-box,.d-lit{fill:var(--panel,#fbf9f4)}
.d-box{stroke:var(--line-2,#d9d3c6)}
.d-group{stroke:var(--line-3,#c7c0b1)}
.d-t,.d-tm{fill:var(--fg,#1b1a18)}
.d-s,.d-c{fill:var(--muted,#6b665d)}
.d-a{stroke:var(--fg-2,#45413a)}
.d-h{fill:var(--fg-2,#45413a)}
}</style>
<defs><marker id="arch-ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-h" d="M0 0L8 4L0 8z"/></marker></defs>
<rect class="d-group" x="284" y="16" width="652" height="248" rx="14"/>
<text class="d-c" x="300" y="38" text-anchor="start">server/ · Express</text>
<rect class="d-box" x="24" y="52" width="216" height="58" rx="10"/><text class="d-t" x="40" y="77">Browser</text><text class="d-s" x="40" y="97">the app (web/, React)</text>
<rect class="d-box" x="24" y="124" width="216" height="58" rx="10"/><text class="d-t" x="40" y="149">MCP clients</text><text class="d-s" x="40" y="169">over HTTP at /mcp</text>
<rect class="d-box" x="24" y="196" width="216" height="58" rx="10"/><text class="d-t" x="40" y="221">lampo · stdio MCP</text><text class="d-s" x="40" y="241">to a hosted server: HTTPS</text>
<path class="d-a" d="M240 81L298 81" marker-end="url(#arch-ah)"/>
<path class="d-a" d="M262 81L262 225"/>
<path class="d-a" d="M240 153L262 153"/>
<path class="d-a" d="M240 225L262 225"/>
<rect class="d-box" x="300" y="52" width="140" height="58" rx="10"/><text class="d-t" x="316" y="77">guard</text><text class="d-s" x="316" y="97">who may do what</text>
<rect class="d-box" x="464" y="52" width="144" height="58" rx="10"/><text class="d-tm" x="480" y="77">routes/</text><text class="d-s" x="480" y="97">the API and /mcp</text>
<rect class="d-box" x="632" y="52" width="288" height="58" rx="10"/><text class="d-t" x="648" y="77">live updates</text><text class="d-s" x="648" y="97">SSE: every open screen at once</text>
<path class="d-a" d="M440 81L462 81" marker-end="url(#arch-ah)"/>
<path class="d-a" d="M608 81L630 81" marker-end="url(#arch-ah)"/>
<rect class="d-box" x="300" y="140" width="196" height="108" rx="10"/><text class="d-t" x="316" y="165">watchers</text><text class="d-s" x="316" y="185">new renders,</text><text class="d-s" x="316" y="203">writes from outside</text>
<rect class="d-box" x="584" y="140" width="336" height="108" rx="10"/><text class="d-t" x="600" y="165">background jobs</text><text class="d-s" x="600" y="185">ffmpeg: scrub copies, posters,</text><text class="d-s" x="600" y="203">diffs, Auto-check, transcripts;</text><text class="d-s" x="600" y="221">one heavy job at a time</text>
<path class="d-a" d="M540 110L540 316" marker-end="url(#arch-ah)"/>
<path class="d-a" d="M440 248L440 316" marker-end="url(#arch-ah)"/>
<rect class="d-box" x="24" y="318" width="216" height="58" rx="10"/><text class="d-t" x="40" y="343">lampo · stdio MCP</text><text class="d-s" x="40" y="363">on your machine</text>
<path class="d-a" d="M240 347L386 347" marker-end="url(#arch-ah)"/>
<text class="d-c" x="314" y="339" text-anchor="middle">directly</text>
<rect class="d-lit" x="388" y="318" width="260" height="58" rx="10"/><text class="d-tm" x="404" y="343">lib/store</text><text class="d-s" x="404" y="363">a lock per video · atomic writes</text>
<path class="d-a" d="M470 376L470 430" marker-end="url(#arch-ah)"/>
<path class="d-a" d="M624 376L624 430" marker-end="url(#arch-ah)"/>
<path class="d-a" d="M736 432L736 250" marker-end="url(#arch-ah)"/>
<path class="d-a" d="M852 248L852 430" marker-end="url(#arch-ah)"/>
<rect class="d-box" x="284" y="432" width="300" height="80" rx="10"/><text class="d-tm" x="300" y="457">data/</text><text class="d-s" x="300" y="477">notes and events, INBOX.md,</text><text class="d-s" x="300" y="495">the frames as PNGs</text>
<rect class="d-box" x="596" y="432" width="176" height="80" rx="10"/><text class="d-tm" x="612" y="457">versions/</text><text class="d-s" x="612" y="477">every render, kept</text><text class="d-s" x="612" y="495">on disk, Bunny or S3</text>
<rect class="d-box" x="784" y="432" width="136" height="80" rx="10"/><text class="d-tm" x="800" y="457">cache/</text><text class="d-s" x="800" y="477">posters, waveforms</text><text class="d-s" x="800" y="495">rebuilt on demand</text>
</svg>
